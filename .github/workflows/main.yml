name: Build and test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allows re-running the job manually, e.g. after a freshly published web
  # component version has aged past Vaadin's npm --min-release-age check.
  workflow_dispatch:

jobs:
  build:
    name: Java 21 build and integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          # Handles the ~/.m2/repository cache.
          cache: maven

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-node-

      # Playwright downloads its browsers on the first Playwright.create() and
      # keeps them here, so caching this turns a ~1 minute download into nothing
      # on later runs.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-playwright-

      # The `it` profile builds the frontend in production mode, starts Jetty,
      # runs the Playwright tests and stops Jetty again.
      - name: Build and run integration tests
        run: mvn -B clean verify -Pit

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: breadcrumb-demo/target/playwright/**
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: breadcrumb-demo/target/failsafe-reports/**
          if-no-files-found: ignore
